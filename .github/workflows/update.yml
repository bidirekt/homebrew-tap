name: Update formulas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formulas

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the formulas from the latest releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit the changed formulas
        run: |
          if [ -z "$(git status --porcelain Formula)" ]; then
            echo "No formula changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "Update formulas to the latest releases"
          git push
